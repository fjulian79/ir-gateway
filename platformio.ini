; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcu-32s

[env]
framework = arduino
lib_deps =  https://github.com/fjulian79/libversion.git
            fjulian79/libgeneric@^2.1.0
            https://github.com/fjulian79/libparam.git#v1.2.0
            fjulian79/libCli@^4.7.0
            crankyoldgit/IRremoteESP8266@^2.9.0
monitor_speed = 115200
monitor_eol = CR
monitor_filters = direct

; OTA password and firmware signing, the secrets are created in secrets/ on the
; first build if missing. Keep a backup of that folder, see README.md.
extra_scripts = pre:scripts/ota_pre.py
                post:scripts/ota_post.py

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
;monitor_filters = esp32_exception_decoder

; Firmware upload via network, use the hostname set by 'param set hostname'.
[env:nodemcu-32s-ota]
extends = env:nodemcu-32s
upload_protocol = espota
upload_port = ir-gateway.local
